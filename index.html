<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 홈페이지</title>
  <meta name="description" content="개인 홈페이지">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --line: #e6e6e6;
      --accent: #f38020;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --card: #1a1b1e;
        --text: #f2f2f2;
        --muted: #a0a0a0;
        --line: #2a2b2f;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 64px 16px;
    }
    main { width: 100%; max-width: 640px; }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #faad3f);
      display: grid; place-items: center;
      font-size: 40px; margin-bottom: 24px;
    }
    h1 { font-size: 32px; letter-spacing: -0.02em; }
    .role { color: var(--muted); margin-top: 4px; }
    .intro { margin-top: 20px; font-size: 17px; }
    h2 {
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin: 48px 0 12px;
    }
    .card {
      display: block; background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 16px 20px; margin-bottom: 10px;
      color: inherit; text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .card strong { display: block; }
    .card span { color: var(--muted); font-size: 14px; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; }
    .links a {
      padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--card); color: var(--text); text-decoration: none; font-size: 14px;
    }
    .links a:hover { border-color: var(--accent); }
    footer { margin-top: 64px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="avatar">👋</div>
    <h1>홍길동</h1>
    <p class="role">개발자 · 서울</p>
    <p class="intro">
      안녕하세요! 이곳은 제 개인 홈페이지입니다.
      만들고 있는 것들과 관심사를 기록하고 있어요.
    </p>

    <h2>프로젝트</h2>
    <a class="card" href="#">
      <strong>프로젝트 하나</strong>
      <span>어떤 프로젝트인지 한 줄로 소개해 주세요.</span>
    </a>
    <a class="card" href="#">
      <strong>프로젝트 둘</strong>
      <span>사용한 기술이나 성과를 적어도 좋아요.</span>
    </a>

    <h2>연락처</h2>
    <div class="links">
      <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:you@example.com">이메일</a>
      <a href="#">블로그</a>
    </div>

    <footer>© <span id="y"></span> 홍길동</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
